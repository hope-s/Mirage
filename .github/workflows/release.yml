# Builds the release on every "v*" tag and attaches it to a GitHub Release,
# so servers can install with the one-line command in the README.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test
      - name: fake-tcp test (needs root)
        run: sudo -E env "PATH=$PATH" go test -count=1 -run TestFakeTCP -v ./internal/node
      - run: make release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mirage-release.tar.gz
            dist/mirage-release.tar.gz.sha256
            dist/mirage/bin/mirage-linux-amd64
            dist/mirage/bin/mirage-linux-arm64
            dist/mirage/bin/mirage-linux-armv7
            install.sh
