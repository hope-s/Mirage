# Runs every test on each push so problems show up before a release tag.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - name: fake-tcp test (needs root)
        run: sudo -E env "PATH=$PATH" go test -count=1 -run TestFakeTCP -v ./internal/node
